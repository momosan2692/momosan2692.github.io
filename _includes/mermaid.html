<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  // Kramdown/Rouge renders ```mermaid as either:
  //   <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre><code>...
  //   or <pre><code class="language-mermaid">...
  // Convert both into <div class="mermaid"> so Mermaid can draw them.
  const targets = new Set();
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
    targets.add(el.matches("code") ? el.parentElement : el);
  });
  targets.forEach((el) => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = el.textContent;
    el.replaceWith(div);
  });

  mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
<style>
  .mermaid { text-align: center; margin: 1.5rem 0; overflow-x: auto; }
</style>
