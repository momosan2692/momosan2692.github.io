<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Where volatile data sits decides how much can be reused" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b636d"/></marker></defs>
<text x="30" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Fig. 3  Where volatile data sits decides how much of the prompt is reused</text>
<text x="30" y="66" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Poor: timestamp first</text>
<rect x="30" y="78" width="86" height="46" rx="6" fill="#d85a30" fill-opacity="0.14" stroke="#d85a30" stroke-width="1.4"/>
<text x="73" y="106" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Time</text>
<rect x="120" y="78" width="196" height="46" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
<text x="218" y="106" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Preamble</text>
<rect x="320" y="78" width="136" height="46" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
<text x="388" y="106" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Role</text>
<rect x="460" y="78" width="136" height="46" rx="6" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.4"/>
<text x="528" y="106" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Context</text>
<rect x="600" y="78" width="126" height="46" rx="6" fill="#d85a30" fill-opacity="0.14" stroke="#d85a30" stroke-width="1.4"/>
<text x="663" y="106" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Data</text>
<text x="30" y="150" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">Grey blocks did not change but are recomputed, because the time before them did.</text>
<text x="30" y="196" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Better: stable first, volatile last</text>
<rect x="30" y="208" width="196" height="46" rx="6" fill="#1d9e75" fill-opacity="0.14" stroke="#1d9e75" stroke-width="1.4"/>
<text x="128" y="236" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Preamble</text>
<rect x="230" y="208" width="136" height="46" rx="6" fill="#1d9e75" fill-opacity="0.14" stroke="#1d9e75" stroke-width="1.4"/>
<text x="298" y="236" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Role</text>
<rect x="370" y="208" width="136" height="46" rx="6" fill="#1d9e75" fill-opacity="0.14" stroke="#1d9e75" stroke-width="1.4"/>
<text x="438" y="236" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Context</text>
<rect x="510" y="208" width="86" height="46" rx="6" fill="#d85a30" fill-opacity="0.14" stroke="#d85a30" stroke-width="1.4"/>
<text x="553" y="236" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Time</text>
<rect x="600" y="208" width="126" height="46" rx="6" fill="#d85a30" fill-opacity="0.14" stroke="#d85a30" stroke-width="1.4"/>
<text x="663" y="236" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Data</text>
<text x="30" y="280" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">The first three blocks are identical, so they hit the cache; only the last two are computed.</text>
<rect x="30" y="304" width="14" height="14" rx="3" fill="#1d9e75" fill-opacity="0.13" stroke="#1d9e75" stroke-width="1.3"/>
<text x="50" y="316" font-size="11.5" font-weight="400" fill="#5b636d" text-anchor="start">cache hit</text>
<rect x="129.4" y="304" width="14" height="14" rx="3" fill="#d85a30" fill-opacity="0.13" stroke="#d85a30" stroke-width="1.3"/>
<text x="149.4" y="316" font-size="11.5" font-weight="400" fill="#5b636d" text-anchor="start">volatile, computed</text>
<rect x="288.2" y="304" width="14" height="14" rx="3" fill="#8a8f98" fill-opacity="0.13" stroke="#8a8f98" stroke-width="1.3"/>
<text x="308.2" y="316" font-size="11.5" font-weight="400" fill="#5b636d" text-anchor="start">unchanged but recomputed</text>
</svg>
