<text x="185" y="90" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">stable 7.5 s</text>
<text x="30" y="123" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">Request 2</text>
<rect x="110" y="106" width="150" height="22" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.3"/>
