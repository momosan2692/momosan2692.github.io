<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Prefill time for four requests, without and with a prefix cache" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b636d"/></marker></defs>
<text x="30" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Fig. 4  Prefill time for four requests: 35 s without a cache, 12.5 s with one</text>
<text x="30" y="60" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Without cache: 4 x 8.75 s = 35 s</text>
<text x="30" y="91" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">Request 1</text>
