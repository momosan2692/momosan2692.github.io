<text x="185" y="122" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">stable 7.5 s</text>
<text x="30" y="155" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">Request 3</text>
<rect x="110" y="138" width="150" height="22" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.3"/>
<rect x="260" y="138" width="25" height="22" fill="#d85a30" fill-opacity="0.14" stroke="#d85a30" stroke-width="1.3"/>
<text x="185" y="154" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">stable 7.5 s</text>
<text x="30" y="187" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">Request 4</text>
<rect x="110" y="170" width="150" height="22" fill="#8a8f98" fill-opacity="0.14" stroke="#8a8f98" stroke-width="1.3"/>
<rect x="260" y="170" width="25" height="22" fill="#d85a30" fill-opacity="0.14" stroke="#d85a30" stroke-width="1.3"/>
<text x="185" y="186" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">stable 7.5 s</text>
<text x="30" y="238" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">With cache: 8.75 s + 3 x 1.25 s = 12.5 s (about 64% saved)</text>
<text x="30" y="269" font-size="12" font-weight="400" fill="#5b636d" text-anchor="start">Request 1</text>
