<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="720" height="330" fill="#fff" stroke="#ddd"/><text x="360.0" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">香農的惡魔:不漲不跌的資產,靠再平衡生出 12.5%</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect x="30" y="70" width="150" height="80" rx="8" fill="#e8f4ea" stroke="#666"/><text x="105" y="102" text-anchor="middle" font-size="14" fill="#222">起點 1000</text><text x="105" y="128" text-anchor="middle" font-size="13" fill="#444">股 500 / 現金 500</text><line x1="185" x2="265" y1="110" y2="110" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="225.0" y="102" text-anchor="middle" font-size="12" fill="#333">股價腰斬</text><rect x="270" y="70" width="150" height="80" rx="8" fill="#fdecea" stroke="#666"/><text x="345" y="102" text-anchor="middle" font-size="14" fill="#222">750</text><text x="345" y="128" text-anchor="middle" font-size="13" fill="#444">股 250 / 現金 500</text><line x1="425" x2="505" y1="110" y2="110" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="465.0" y="102" text-anchor="middle" font-size="12" fill="#333">再平衡</text><rect x="510" y="70" width="150" height="80" rx="8" fill="#e8f0fb" stroke="#666"/><text x="585" y="102" text-anchor="middle" font-size="14" fill="#222">750</text><text x="585" y="128" text-anchor="middle" font-size="13" fill="#444">股 375 / 現金 375</text><line x1="585" x2="585" y1="160" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="585.0" y="152" text-anchor="middle" font-size="12" fill="#333"></text><text x="585" y="190" text-anchor="middle" font-size="12" fill="#333">↓ 股價翻倍</text><rect x="510" y="200" width="150" height="80" rx="8" fill="#e8f4ea" stroke="#666"/><text x="585" y="232" text-anchor="middle" font-size="14" fill="#222">1125</text><text x="585" y="258" text-anchor="middle" font-size="13" fill="#444">股 750 / 現金 375</text><text x="30" y="250" font-size="14" fill="#222">股價:1000 → 500 → 1000,回到原點;</text><text x="30" y="276" font-size="14" fill="#222">總資產:1000 → 1125,靠再平衡多出 12.5%。</text></svg>