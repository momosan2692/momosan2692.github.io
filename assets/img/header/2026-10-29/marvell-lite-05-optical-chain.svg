<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="34" font-size="19" font-weight="700" text-anchor="middle" fill="#1b2430">一條光鏈路上的四格：誰擁有哪一格</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8794a6"/></marker></defs>
<g stroke="#8794a6" stroke-width="3" marker-end="url(#a)"><line x1="190" y1="130" x2="226" y2="130"/><line x1="390" y1="130" x2="426" y2="130"/><line x1="590" y1="130" x2="626" y2="130"/></g>
<g text-anchor="middle" font-size="14" fill="#fff">
<rect x="30" y="80" width="160" height="100" rx="8" fill="#e76f51"/><text x="110" y="116" font-weight="700">光源</text><text x="110" y="140" font-size="12">CW 雷射、EML</text><text x="110" y="160" font-size="12">Lumentum</text>
<rect x="230" y="80" width="80" height="100" rx="8" fill="#2a9d8f"/><rect x="310" y="80" width="80" height="100" rx="8" fill="#e76f51"/>
<text x="270" y="116" font-weight="700">光引擎</text><text x="270" y="140" font-size="12">Celestial</text><text x="350" y="116" font-weight="700">收發</text><text x="350" y="140" font-size="12">Lumentum</text>
<rect x="430" y="80" width="160" height="100" rx="8" fill="#1f4e79"/><text x="510" y="116" font-weight="700">DSP／TIA／driver</text><text x="510" y="140" font-size="12">Ara 1.6T</text><text x="510" y="160" font-size="12">Marvell</text>
<rect x="630" y="80" width="140" height="100" rx="8" fill="#e76f51"/><text x="700" y="116" font-weight="700">OCS 光交換</text><text x="700" y="140" font-size="12">Lumentum</text>
</g>
<g font-size="14" fill="#1b2430" text-anchor="middle">
<text x="30" y="236" text-anchor="start" font-weight="700">交易前 Marvell 掌握</text>
<text x="110" y="268">無</text><text x="270" y="268">光引擎有</text><text x="350" y="268">收發無</text><text x="510" y="268">有</text><text x="700" y="268">無</text>
<text x="30" y="316" text-anchor="start" font-weight="700">交易後</text>
<text x="110" y="348">有</text><text x="270" y="348">有</text><text x="350" y="348">有</text><text x="510" y="348">有</text><text x="700" y="348">有</text>
</g>
<text x="400" y="396" font-size="12" text-anchor="middle" fill="#5b6675">以公開資訊整理；各元件是否內部互供，雙方未揭露</text>
</svg>
