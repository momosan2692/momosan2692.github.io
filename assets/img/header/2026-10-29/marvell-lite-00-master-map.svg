<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#1b2430">總圖：Marvell 與併購標的在 AI 機櫃裡的位置</text>

<!-- bands -->
<rect x="20" y="56" width="300" height="464" rx="8" fill="#f7f8fa" stroke="#c5ccd6"/>
<rect x="340" y="56" width="300" height="464" rx="8" fill="#f7f8fa" stroke="#c5ccd6"/>
<rect x="660" y="56" width="280" height="464" rx="8" fill="#f7f8fa" stroke="#c5ccd6"/>
<g text-anchor="middle" fill="#1b2430">
<text x="170" y="82" font-size="15" font-weight="700">封裝內</text><text x="170" y="100" font-size="11" fill="#5b6675">公分尺度</text>
<text x="490" y="82" font-size="15" font-weight="700">機櫃內</text><text x="490" y="100" font-size="11" fill="#5b6675">公尺尺度</text>
<text x="800" y="82" font-size="15" font-weight="700">Pod／跨機櫃</text><text x="800" y="100" font-size="11" fill="#5b6675">數十公尺</text>
</g>

<!-- links -->
<g stroke="#8794a6" stroke-width="2.5"><line x1="290" y1="175" x2="365" y2="165"/><line x1="290" y1="300" x2="365" y2="250"/></g>
<line x1="62" y1="285" x2="62" y2="470" stroke="#2a9d8f" stroke-width="4"/><line x1="62" y1="285" x2="75" y2="285" stroke="#2a9d8f" stroke-width="4"/>
<line x1="490" y1="440" x2="490" y2="470" stroke="#8794a6" stroke-width="4"/>
<line x1="800" y1="435" x2="800" y2="470" stroke="#e76f51" stroke-width="4"/>
<line x1="932" y1="170" x2="932" y2="470" stroke="#2a9d8f" stroke-width="4"/><line x1="920" y1="170" x2="932" y2="170" stroke="#2a9d8f" stroke-width="4"/>
<line x1="800" y1="285" x2="800" y2="300" stroke="#e76f51" stroke-width="3" stroke-dasharray="4 3"/>

<!-- band A -->
<rect x="50" y="120" width="240" height="210" rx="6" fill="none" stroke="#8794a6" stroke-dasharray="6 4"/>
<text x="60" y="137" font-size="11" fill="#5b6675">XPU 封裝</text>
<g text-anchor="middle" fill="#fff">
<rect x="75" y="150" width="110" height="80" rx="6" fill="#1f4e79"/><text x="130" y="186" font-size="14" font-weight="700">客製 XPU</text><text x="130" y="206" font-size="11">Marvell 客製矽</text>
<rect x="200" y="150" width="70" height="38" rx="5" fill="#5b6675"/><text x="235" y="175" font-size="13">HBM</text>
<rect x="200" y="195" width="70" height="38" rx="5" fill="#5b6675"/><text x="235" y="220" font-size="13">HBM</text>
<rect x="75" y="255" width="195" height="60" rx="6" fill="#2a9d8f"/><text x="172" y="281" font-size="13" font-weight="700">Photonic Fabric chiplet</text><text x="172" y="300" font-size="11">Celestial AI｜16 Tbps／顆</text>
<rect x="75" y="365" width="195" height="50" rx="6" fill="#1f4e79"/><text x="172" y="388" font-size="13" font-weight="700">NIC／DPU</text><text x="172" y="405" font-size="11">XPU-attach</text>
</g>

<!-- band B -->
<g text-anchor="middle" fill="#fff">
<rect x="365" y="130" width="250" height="70" rx="6" fill="#1f4e79"/><text x="490" y="159" font-size="14" font-weight="700">UALink／ESUN 交換</text><text x="490" y="180" font-size="11">Marvell 自研；對接 NVLink Fusion</text>
<rect x="365" y="215" width="250" height="70" rx="6" fill="#2a9d8f"/><text x="490" y="244" font-size="14" font-weight="700">PCIe／CXL 交換</text><text x="490" y="265" font-size="11">XConn｜PCIe 6／CXL 3.1 送樣</text>
<rect x="365" y="300" width="250" height="70" rx="6" fill="#1f4e79"/><text x="490" y="329" font-size="14" font-weight="700">Structera CXL 記憶體控制器</text><text x="490" y="350" font-size="11">機櫃 DRAM 池，規模 100TB 以上</text>
<rect x="365" y="385" width="250" height="55" rx="6" fill="#1f4e79"/><text x="490" y="408" font-size="14" font-weight="700">Teralynx 乙太網交換</text><text x="490" y="427" font-size="11">51.2T 放量，200T 在研</text>
</g>

<!-- band C -->
<g text-anchor="middle" fill="#fff">
<rect x="680" y="130" width="240" height="80" rx="6" fill="#2a9d8f"/><text x="800" y="164" font-size="14" font-weight="700">Photonic Fabric 記憶體模組</text><text x="800" y="186" font-size="11">Celestial AI｜最遠 50 公尺、32TB</text>
<rect x="680" y="225" width="115" height="60" rx="6" fill="#1f4e79"/><text x="737" y="251" font-size="12" font-weight="700">Ara 1.6T DSP</text><text x="737" y="269" font-size="11">TIA／driver</text>
<rect x="805" y="225" width="115" height="60" rx="6" fill="#e76f51" stroke="#b8482d" stroke-dasharray="5 3" stroke-width="2"/><text x="862" y="251" font-size="12" font-weight="700">光收發模組</text><text x="862" y="269" font-size="11">Lumentum</text>
<rect x="680" y="300" width="240" height="60" rx="6" fill="#e76f51" stroke="#b8482d" stroke-dasharray="5 3" stroke-width="2"/><text x="800" y="326" font-size="14" font-weight="700">CW 雷射／EML 光源</text><text x="800" y="345" font-size="11">Lumentum（洽購中）</text>
<rect x="680" y="375" width="240" height="60" rx="6" fill="#e76f51" stroke="#b8482d" stroke-dasharray="5 3" stroke-width="2"/><text x="800" y="401" font-size="14" font-weight="700">光電路交換 OCS</text><text x="800" y="420" font-size="11">Lumentum（洽購中）</text>
</g>

<!-- bus -->
<rect x="40" y="470" width="880" height="40" rx="6" fill="#dfe5ec"/>
<text x="480" y="495" font-size="14" text-anchor="middle" fill="#1b2430">光纖／光互連骨幹：連到其他機櫃與其他 pod</text>

<!-- number badges -->
<g font-size="12" font-weight="700" text-anchor="middle" fill="#1b2430" stroke="#1b2430">
<g fill="#fff"><circle cx="75" cy="255" r="11"/><circle cx="75" cy="150" r="11"/><circle cx="75" cy="365" r="11"/><circle cx="365" cy="130" r="11"/><circle cx="365" cy="215" r="11"/><circle cx="365" cy="300" r="11"/><circle cx="680" cy="130" r="11"/><circle cx="680" cy="300" r="11"/><circle cx="805" cy="225" r="11"/><circle cx="680" cy="375" r="11"/></g>
</g>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#1b2430">
<text x="75" y="259">1</text><text x="75" y="154">5</text><text x="75" y="369">5</text><text x="365" y="134">3</text><text x="365" y="219">2</text><text x="365" y="304">2</text><text x="680" y="134">2</text><text x="680" y="304">4</text><text x="805" y="229">4</text><text x="680" y="379">4</text>
</g>

<!-- legend -->
<g font-size="13" fill="#1b2430">
<rect x="40" y="544" width="16" height="16" fill="#1f4e79"/><text x="62" y="557">Marvell 既有</text>
<rect x="170" y="544" width="16" height="16" fill="#2a9d8f"/><text x="192" y="557">已併購（Celestial AI、XConn）</text>
<rect x="400" y="544" width="16" height="16" fill="#e76f51" stroke="#b8482d" stroke-dasharray="3 2"/><text x="422" y="557">洽購標的 Lumentum（未簽約）</text>
<rect x="620" y="544" width="16" height="16" fill="#5b6675"/><text x="642" y="557">第三方</text>
<text x="40" y="584" font-size="12" fill="#5b6675">圓圈數字 1–5 對應文中五條戰略線：1 光 I/O　2 記憶體解耦　3 協定中立　4 光層整合　5 客製 XPU 掛載</text>
</g>
