<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="34" font-size="19" font-weight="700" text-anchor="middle" fill="#1b2430">HBM 之下的三層記憶體</text>
<g text-anchor="middle" fill="#fff">
<rect x="270" y="64" width="260" height="62" rx="6" fill="#5b6675"/><text x="400" y="92" font-size="15" font-weight="700">HBM（封裝內）</text><text x="400" y="113" font-size="12">最近、最快、容量最小</text>
<rect x="220" y="140" width="360" height="62" rx="6" fill="#1f4e79"/><text x="400" y="168" font-size="15" font-weight="700">伺服器層：NAND</text><text x="400" y="189" font-size="12">Bravera 控制器，多供應商 NAND</text>
<rect x="150" y="216" width="500" height="62" rx="6" fill="#1f4e79"/><text x="400" y="244" font-size="15" font-weight="700">機櫃層：CXL 池化 DRAM</text><text x="400" y="265" font-size="12">Structera + XConn 交換；規模 100TB 以上（Counterpoint 估算）</text>
<rect x="80" y="292" width="640" height="62" rx="6" fill="#2a9d8f"/><text x="400" y="320" font-size="15" font-weight="700">Pod 層：光學共享記憶體（Photonic Fabric）</text><text x="400" y="341" font-size="12">跨多機櫃、最遠 50 公尺、最多 32TB warm KV cache（Marvell 公布）</text>
</g>
<text x="400" y="384" font-size="13" text-anchor="middle" fill="#1b2430">往下：距離變長、容量變大、延遲變高</text>
<text x="400" y="410" font-size="12" text-anchor="middle" fill="#5b6675">這套設計押的是「記憶體容量而非算力，才是推論成本的瓶頸」</text>
</svg>
