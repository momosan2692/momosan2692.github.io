<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="34" font-size="19" font-weight="700" text-anchor="middle" fill="#1b2430">從 Celestial AI 到 Lumentum：時間軸</text>
<line x1="40" y1="210" x2="760" y2="210" stroke="#8794a6" stroke-width="4"/>
<g stroke="#8794a6" stroke-width="2"><line x1="70" y1="210" x2="70" y2="165"/><line x1="250" y1="210" x2="250" y2="165"/><line x1="430" y1="210" x2="430" y2="165"/><line x1="625" y1="210" x2="625" y2="165"/><line x1="160" y1="210" x2="160" y2="255"/><line x1="340" y1="210" x2="340" y2="255"/><line x1="520" y1="210" x2="520" y2="255"/><line x1="725" y1="210" x2="725" y2="255"/></g>
<g fill="#1f4e79"><circle cx="70" cy="210" r="8"/><circle cx="160" cy="210" r="8"/><circle cx="250" cy="210" r="8"/><circle cx="340" cy="210" r="8"/><circle cx="430" cy="210" r="8"/><circle cx="520" cy="210" r="8"/><circle cx="725" cy="210" r="8"/></g>
<circle cx="625" cy="210" r="10" fill="#e76f51"/>
<g font-size="12" text-anchor="middle" fill="#1b2430">
<text x="70" y="108" font-weight="700">2025/12</text><text x="70" y="126">宣布收購</text><text x="70" y="142">Celestial AI</text><text x="70" y="158">2.5 億</text>
<text x="250" y="108" font-weight="700">2026/02</text><text x="250" y="126">Celestial AI</text><text x="250" y="142">交割完成</text>
<text x="430" y="108" font-weight="700">2026/03/31</text><text x="430" y="126">Nvidia 投資 Marvell</text><text x="430" y="142">0 億（單一來源）</text>
<text x="625" y="108" font-weight="700" fill="#e76f51">2026/10/28</text><text x="625" y="126">Bloomberg 報導</text><text x="625" y="142">Marvell 洽購 Lumentum</text>
<text x="160" y="276" font-weight="700">2026/01</text><text x="160" y="294">宣布收購 XConn</text><text x="160" y="310">.4 億</text>
<text x="340" y="276" font-weight="700">2026/03/02</text><text x="340" y="294">Nvidia 各投 0 億</text><text x="340" y="310">Lumentum、Coherent</text>
<text x="520" y="276" font-weight="700">FY27 下半年</text><text x="520" y="294">XConn 開始</text><text x="520" y="310">貢獻營收</text>
<text x="725" y="276" font-weight="700">FY28 下半年</text><text x="725" y="294">Photonic Fabric</text><text x="725" y="310">開始貢獻營收</text>
</g>
<text x="400" y="380" font-size="12" text-anchor="middle" fill="#5b6675">時間軸非等比例。FY 為 Marvell 會計年度（約 2 月至隔年 1 月）。</text>
</svg>
