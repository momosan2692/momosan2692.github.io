<rect x="486" y="176" width="290" height="44" rx="6" fill="#1f4e79"/><text x="631" y="204" fill="#fff">NVLink Fusion 整合</text>

<rect x="24" y="232" width="150" height="44" rx="6" fill="#eef1f5" stroke="#c5ccd6"/><text x="99" y="260" fill="#1b2430">光 I/O</text>
