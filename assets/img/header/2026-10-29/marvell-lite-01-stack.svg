<rect x="190" y="120" width="290" height="44" rx="6" fill="#1f4e79"/><text x="335" y="148" fill="#fff">Structera CXL 控制器</text>
<rect x="486" y="120" width="290" height="44" rx="6" fill="#2a9d8f"/><text x="631" y="148" fill="#fff">XConn CXL／PCIe 交換</text>

<rect x="24" y="176" width="150" height="44" rx="6" fill="#eef1f5" stroke="#c5ccd6"/><text x="99" y="204" fill="#1b2430">Scale-up 交換</text>
