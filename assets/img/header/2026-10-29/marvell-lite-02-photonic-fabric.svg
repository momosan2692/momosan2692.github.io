<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="34" font-size="19" font-weight="700" text-anchor="middle" fill="#1b2430">光 I/O 上 die：打破邊緣周長的限制</text>
<rect x="30" y="56" width="350" height="250" rx="8" fill="#f7f8fa" stroke="#c5ccd6"/>
<rect x="420" y="56" width="350" height="250" rx="8" fill="#f7f8fa" stroke="#c5ccd6"/>
<g font-size="15" font-weight="700" text-anchor="middle" fill="#1b2430">
<text x="205" y="84">傳統電氣 I/O</text><text x="595" y="84">光 I/O（Photonic Fabric）</text></g>
<rect x="135" y="120" width="140" height="140" rx="4" fill="#cfd8e3"/>
<g stroke="#c0392b" stroke-width="5"><line x1="205" y1="120" x2="205" y2="98"/><line x1="205" y1="260" x2="205" y2="282"/><line x1="135" y1="190" x2="113" y2="190"/><line x1="275" y1="190" x2="297" y2="190"/></g>
<text x="205" y="196" font-size="14" text-anchor="middle" fill="#1b2430">XPU</text>
<text x="205" y="298" font-size="12" text-anchor="middle" fill="#1b2430">訊號只能從晶片邊緣出去</text>
<rect x="525" y="120" width="140" height="140" rx="4" fill="#cfd8e3"/>
<rect x="565" y="160" width="60" height="60" rx="4" fill="#2a9d8f"/>
<text x="595" y="196" font-size="13" text-anchor="middle" fill="#fff">光 I/O</text>
<g stroke="#2a9d8f" stroke-width="4"><line x1="575" y1="160" x2="575" y2="100"/><line x1="595" y1="160" x2="595" y2="100"/><line x1="615" y1="160" x2="615" y2="100"/></g>
<text x="595" y="298" font-size="12" text-anchor="middle" fill="#1b2430">光訊號從封裝內部直接送出</text>
<g font-size="14" fill="#1b2430">
<text x="40" y="340">單顆 chiplet：16 Tbps（單向）；單一封裝可到 64 Tbps（雙向）</text>
<text x="40" y="366">Marvell 目標：FY28 下半年開始貢獻營收，Q4 FY28 年化 5 億美元，Q4 FY29 年化 10 億美元</text>
<text x="40" y="402" font-size="12" fill="#5b6675">數字為公司公布的目標，非實績。來源：Marvell 公告、Converge Digest。</text></g>
